<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Transferencia - Banco Simulado</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Hacer Transferencia</h1>
        <form id="transferForm">
            <input type="text" id="toUser" placeholder="Usuario destino" required>
            <input type="number" id="amount" placeholder="Monto" required>
            <button type="submit">Transferir</button>
        </form>
        <p id="transferMessage"></p>
        <button onclick="window.location.href='dashboard.html'">Volver al Dashboard</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
